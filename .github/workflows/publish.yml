name: publish

# Every push and pull request is validated; a `v*` tag also publishes `dist/` to npm.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

# Tag runs (the only ones that release) never cancel: the expression below is false for them.
# jactionlint ignore=concurrency-cancels-release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          # No caches: a tag run builds what gets published, and a poisoned cache would ship.
          no-cache: true
      # test/node.test.ts runs the bundle on Node, as the VS Code extension does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint:self
      - run: bun run bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./dist/package.json").version')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG but package version $version"; exit 1; }
      - run: npm publish
        working-directory: dist

  # After npm has the version, so a release always points at a published package.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes need the previous tag
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
